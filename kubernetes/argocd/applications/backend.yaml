apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VuCongTien/aws-eks-gitops-platform-infra.git
    targetRevision: main
    path: helm/backend
    helm:
      releaseName: backend-app
  destination:
    server: https://kubernetes.default.svc
    namespace: backend-ns
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
