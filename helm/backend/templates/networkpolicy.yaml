apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata: 
  name: backend-network-policy
  namespace: be-namespace

spec:
  podSelector: 
    matchLabels: 
      app: backend
  
  policyTypes: 
    - Ingress
    - Egress

  ingress: 
    - from: 
        - namespaceSelector: {} 
      ports: 
        - port: 5000
        
