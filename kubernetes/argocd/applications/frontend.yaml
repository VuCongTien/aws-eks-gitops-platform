apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VuCongTien/aws-eks-gitops-platform
    targetRevision: main
    path: helm/frontend
    helm:
      releaseName: frontend-app
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-ns
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
